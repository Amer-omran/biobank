[project]
name = "healthmisinfo"
version = "0.1.0"
description = "Bilingual (Arabic/English) health misinformation detection research platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:healthmisinfo.*"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S311", "S603", "S607", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"healthmisinfo/api/routes/*" = ["B904"]
"healthmisinfo/config.py" = ["S105"]
"alembic/versions/*" = ["E501"]
