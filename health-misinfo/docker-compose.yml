# docker compose --env-file .env up --build
# BACKEND_URL is baked into the Next.js build (rewrites); it is passed as a build arg.
# First admin: docker compose exec api python -m healthmisinfo.cli create-user --email you@org --name You --role admin
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthmisinfo}
      POSTGRES_USER: ${POSTGRES_USER:-hmd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hmd} -d ${POSTGRES_DB:-healthmisinfo}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        INSTALL_ML: ${INSTALL_ML:-0}
    environment:
      HMD_ENVIRONMENT: production
      HMD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hmd}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-healthmisinfo}
      HMD_SECRET_KEY: ${HMD_SECRET_KEY:?set HMD_SECRET_KEY (>=32 chars) in .env}
      HMD_AUDIT_IP_SALT: ${HMD_AUDIT_IP_SALT:-}
      HMD_CORS_ORIGINS: ${HMD_CORS_ORIGINS:-http://localhost:3000}
      HMD_COOKIE_SECURE: ${HMD_COOKIE_SECURE:-false}
      HMD_REVIEWS_REQUIRED: ${HMD_REVIEWS_REQUIRED:-2}
    volumes:
      - ./models:/app/models:ro
      - ./data/processed:/app/data/processed
      - ./data/raw:/app/data/raw:ro
      - ./data/manual:/app/data/manual:ro
    depends_on:
      db:
        condition: service_healthy
    # Not published: only the web container talks to the API.
    expose: ["8000"]
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://api:8000
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
